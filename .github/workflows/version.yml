# .github/workflows/version.yml
name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump version'
        required: true
        type: choice
        options: [major, minor, patch, rc, beta, alpha]
        default: 'patch'

# 本仓库 Actions 的默认 GITHUB_TOKEN 权限是 read，而 bump job 需要把版本提交与 tag 推回
# main（Push changes 步骤），不显式声明就会以 403 "Resource not accessible by integration" 失败。
# packages:write 是 build job 调用 build.yml 时所需的权限天花板，必须在此一并放开。
permissions:
  contents: write
  packages: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{env.version}}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
        fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.

    - name: Setup
      uses: ./.github/actions/setup

    - name: Bump version ${{ github.event.inputs.bump }}
      run: |
        just bump ${{ github.event.inputs.bump }}
        echo "version=v$(just version)" >> "$GITHUB_ENV"
        
    - name: Commit files
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git commit -a -m "🔖 Bump version to $version"
        git tag -a $version -m ""

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
        tags: true

  build:
    needs: [ "bump" ]
    # caller 的 permissions 是 reusable workflow 的权限天花板，
    # 必须覆盖 build.yml workflow 级声明的所有权限（contents:write + packages:write），
    # 否则 GitHub Actions 报 startup_failure（reusable workflow 不允许提升权限）。
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.bump.outputs.version }}
      prerelease: ${{ !contains('major, minor, patch', inputs.bump) }}

  publish:
    needs: [ "bump", "build" ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.version }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Publish to crates.io
        continue-on-error: true
        run: just publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
