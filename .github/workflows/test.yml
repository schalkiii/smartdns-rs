# .github/workflows/test.yml

name: Test

on:
  push:
    branches:
      - main
      - release/**
      - ci*
  pull_request:
    branches:
      - main
      - release/**

jobs:
  test:
    name: test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            # 固定 macos-14：macos-latest 在 2026-10-30 连续一小时分配不到 runner
            # （任务空转 15 分钟后被取消，runner_id=0、steps=0）。此前 macos-latest
            # 同样解析到 Apple Silicon，x86_64 测试本就跑在 Rosetta 上，行为不变。
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{matrix.os}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust_target: ${{ matrix.target }}

      - name: Test
        run: just test --features=disable_icmp_ping 2>&1 | tee test.log
        env:
          USE_CROSS: ${{ matrix.os == 'ubuntu-latest' }}

      # 失败测试名写入 annotation：日志域名在部分网络下不可达，annotation 始终可读
      - name: Surface failing tests
        if: failure()
        shell: bash
        run: |
          if [ -f test.log ]; then
            grep -E '^(test .*FAILED|failures:|---- .* stdout ----|thread .*panicked|error\[E[0-9]+\])' test.log               | head -40 | while IFS= read -r line; do echo "::error title=test-failure::$line"; done
            echo '--- failure context ---'
            grep -n -A20 'stdout ----' test.log | head -60
          fi

  cleanliness:
    name: cleanliness ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust_target: ${{ matrix.target }}

      - name: Install Rust Toolchain Components
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          target: ${{ matrix.target }}



      - name: Clippy & Rustfmt
        run: just cleanliness
        env:
          USE_CROSS: ${{ matrix.os == 'ubuntu-latest' }}
      
  compatibility:
    name: compatibility ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: i686-pc-windows-msvc
            os: windows-latest
            archive: zip
          # - target: i686-pc-windows-gnu  # error: linker `i686-w64-mingw32-gcc` not found
          #   os: windows-latest
          #   archive: zip
          # macOS 目标不在此重复打包：一次 push 若同时排 test + cleanliness + compatibility
          # 三个 macOS 任务，runner 抢不到时空转 15 分钟就被取消（runner_id=0、steps=0），
          # 整个 run 判失败。两个 darwin 目标的编译与打包由 build.yml 在发版时验证，
          # 这里保留上面的 test x86_64-apple-darwin 覆盖 macOS 运行时行为。
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          # - target: arch64-unknown-linux-musl
          #   archive: tar.gz tar.xz tar.zst
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          - target: arm-unknown-linux-musleabi
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          - target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          # - target: mips-unknown-linux-musl
          #   archive: tar.gz tar.xz tar.zst
          # - target: mips-unknown-linux-musl
          #   archive: tar.gz tar.xz tar.zst
          # - target: mips64-unknown-linux-muslabi64
          #   archive: tar.gz tar.xz tar.zst
          - target: aarch64-linux-android
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          # - target: x86_64-unknown-freebsd
          #   os: ubuntu-latest
          #   archive: tar.gz tar.xz tar.zst
          # - target: x86_64-unknown-netbsd
          #   os: ubuntu-latest
          #   archive: tar.gz tar.xz tar.zst
          # - target: wasm32-unknown-emscripten
          #   archive: tar.gz tar.xz tar.zst
    runs-on: ${{matrix.os}}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust_target: ${{ matrix.target }}

      - name: Check
        run: just check --target ${{ matrix.target }}
        env:
          USE_CROSS: ${{ matrix.os == 'ubuntu-latest' }}


