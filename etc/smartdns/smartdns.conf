# SmartDNS-rs 默认配置（开箱即用）
#
# 本文件既是发行包内附带的配置，也是 `smartdns service install` 写入系统的默认配置，
# 不做任何修改即可直接用于解析域名。
# 完整选项与逐条注释参见同目录下的 example.conf。

# 本机标识，会出现在 PTR 应答与服务名中，按需修改
server-name smartdns

# DNS 监听：UDP + TCP 53，同时覆盖 IPv4 与 IPv6
bind [::]:53

# 本地 Web 管理面板。默认只监听回环，避免把无鉴权的管理接口暴露到局域网。
# 需要局域网内其他设备访问时改为 bind-http :8080，并自行做好访问控制。
# 浏览器打开 http://127.0.0.1:8080/dashboard
bind-http 127.0.0.1:8080

# ---------------- 上游 DNS ----------------
# 引导组：仅用于解析下面加密上游的域名，不参与日常查询
server-https https://223.5.5.5/dns-query -group bootstrap -exclude-default-group
server-https https://dns.google/dns-query -group bootstrap -exclude-default-group

# UDP 明文兜底：加密源不可达时仍能解析
server 223.5.5.5
server 223.6.6.6
server 114.114.114.119

# 加密上游（DoH / DoT）：与 UDP 源并发查询
server-https https://doh.pub/dns-query
server-https https://dns.alidns.com/dns-query
server-https https://cloudflare-dns.com/dns-query
server-tls 8.8.8.8:853

# ---------------- 应答与缓存策略 ----------------
# 多上游并发，取最先返回的应答，这是本地 DNS 的核心收益
response-mode fastest-response

# 缓存扩容 + 过期项 prefetch 并在超时窗口内先行应答，抗上游抖动
cache-size 65536
prefetch-domain yes
serve-expired yes

# HTTPS/SVCB（qtype 65）直接回 SOA，避免下游无谓等待
force-qtype-soa 65

# 日志级别：info 足够日常排障，需要逐条查询过程时改 debug
log-level info

# 本机 IPv6 链路差、AAAA 经常超时的时候再打开，纯 IPv6 环境切勿开启
# force-aaaa-soa yes
